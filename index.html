<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Solar Panel Grid Calculator</title>

  <!-- THREE.JS -->
  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    window.THREE = THREE;
    window.OrbitControls = OrbitControls;
  </script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dff6ff, #ffffff);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #00796b;
    }

    .controls {
      margin-bottom: 20px;
    }

    .controls label {
      display: inline-block;
      width: 170px;
      margin-top: 10px;
    }

    .controls input {
      width: 100px;
      padding: 6px;
    }

    button {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #00796b;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #004d40;
    }

    #scene-container {
      width: 100%;
      height: 500px;
      border-radius: 12px;
      overflow: hidden;
      background: #dbefff;
    }

    #energyOutput {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #004d40;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>3D Solar Panel Grid Calculator</h1>

  <div class="controls">
    <label>Width of area (m):</label>
    <input type="number" id="width" value="5" min="1"><br>

    <label>Height of area (m):</label>
    <input type="number" id="height" value="3" min="1"><br>

    <label>Panel width (m):</label>
    <input type="number" id="panelWidth" value="1" min="0.1" step="0.1"><br>

    <label>Panel height (m):</label>
    <input type="number" id="panelHeight" value="2" min="0.1" step="0.1"><br>

    <button id="generateBtn">Generate 3D Grid</button>
  </div>

  <div id="scene-container"></div>

  <div id="energyOutput"></div>

</div>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import { OrbitControls } from "https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js";

const container = document.getElementById("scene-container");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xdbefff);

const camera = new THREE.PerspectiveCamera(
  60,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);

camera.position.set(8, 8, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setSize(container.clientWidth, container.clientHeight);
renderer.shadowMap.enabled = true;

container.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);

controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 1);

sunLight.position.set(10, 20, 10);
sunLight.castShadow = true;

scene.add(sunLight);

const groundGeometry = new THREE.PlaneGeometry(50, 50);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xb8e0b8
});

const ground = new THREE.Mesh(groundGeometry, groundMaterial);

ground.rotation.x = -Math.PI / 2;

ground.receiveShadow = true;

scene.add(ground);

let panelGroup = new THREE.Group();

scene.add(panelGroup);

    panelGroup.remove(panelGroup.children[0]);
