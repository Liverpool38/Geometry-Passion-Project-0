<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Solar Panel Calculator</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #dff6ff, #ffffff);
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 95%;
      max-width: 1100px;
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #00796b;
    }

    .controls {
      margin-bottom: 20px;
    }

    .controls label {
      display: inline-block;
      width: 180px;
      margin-top: 10px;
    }

    .controls input {
      width: 100px;
      padding: 6px;
    }

    button {
      margin-top: 15px;
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      background: #00796b;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #004d40;
    }

    #scene-container {
      width: 100%;
      height: 600px;
      border-radius: 12px;
      overflow: hidden;
      background: #cfefff;
    }

    #energyOutput {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
      color: #004d40;
    }

    canvas {
      display: block;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>3D Solar Panel Grid Calculator</h1>

  <div class="controls">
    <label>Width of area (m):</label>
    <input type="number" id="width" value="5"><br>

    <label>Height of area (m):</label>
    <input type="number" id="height" value="3"><br>

    <label>Panel width (m):</label>
    <input type="number" id="panelWidth" value="1" step="0.1"><br>

    <label>Panel height (m):</label>
    <input type="number" id="panelHeight" value="2" step="0.1"><br>

    <button id="generateBtn">Generate 3D Grid</button>
  </div>

  <div id="scene-container"></div>

  <div id="energyOutput"></div>

</div>

<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';

import { OrbitControls }
from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/controls/OrbitControls.js';

const container = document.getElementById("scene-container");

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfefff);

const camera = new THREE.PerspectiveCamera(
  60,
  container.clientWidth / container.clientHeight,
  0.1,
  1000
);

camera.position.set(8, 8, 10);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(
  container.clientWidth,
  container.clientHeight
);

renderer.shadowMap.enabled = true;

container.appendChild(renderer.domElement);

const controls = new OrbitControls(
  camera,
  renderer.domElement
);

controls.enableDamping = true;

const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambientLight);

const directionalLight = new THREE.DirectionalLight(0xffffff, 1);

directionalLight.position.set(10, 20, 10);

scene.add(directionalLight);

const groundGeometry = new THREE.PlaneGeometry(50, 50);

const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0xa5d6a7
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;

scene.add(ground);

let panelGroup = new THREE.Group();

scene.add(panelGroup);

function generateGrid() {

  while (panelGroup.children.length > 0) {
    panelGroup.remove(panelGroup.children[0]);
  }

  const width =
    parseFloat(document.getElementById("width").value);

  const height =
    parseFloat(document.getElementById("height").value);

  const panelWidth =
    parseFloat(document.getElementById("panelWidth").value);

  const panelHeight =
    parseFloat(document.getElementById("panelHeight").value);

  const cols = Math.floor(width / panelWidth);
  const rows = Math.floor(height / panelHeight);

  const totalPanels = cols * rows;

  const spacing = 0.15;

  const panelMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x1565c0,
      metalness: 0.5,
      roughness: 0.3
    });

  const frameMaterial =
    new THREE.MeshStandardMaterial({
      color: 0x444444
    });

  for (let r = 0; r < rows; r++) {

    for (let c = 0; c < cols; c++) {

      const panelGeometry =
        new THREE.BoxGeometry(
          panelWidth,
          0.08,
          panelHeight
        );

      const panel =
        new THREE.Mesh(
          panelGeometry,
          panelMaterial
        );

      panel.position.x =
        c * (panelWidth + spacing);

      panel.position.z =
        r * (panelHeight + spacing);

      panel.position.y = 0.6;

      panel.rotation.x = -0.4;

      panelGroup.add(panel);

      const standGeometry =
        new THREE.BoxGeometry(
          panelWidth * 0.9,
          0.5,
          0.08
        );

      const stand =
        new THREE.Mesh(
          standGeometry,
          frameMaterial
        );

      stand.position.set(
        panel.position.x,
        0.25,
        panel.position.z
      );

      panelGroup.add(stand);
    }
  }

  panelGroup.position.x =
    -(cols * (panelWidth + spacing)) / 2;

  panelGroup.position.z =
    -(rows * (panelHeight + spacing)) / 2;

  const energyPerPanel = 0.3;
  const sunHours = 5;

  const dailyEnergy =
    totalPanels * energyPerPanel * sunHours;

  document.getElementById("energyOutput").innerHTML =
    `
    Panels: ${totalPanels}<br>
    Estimated Daily Energy:
    ${dailyEnergy.toFixed(2)} kWh
    `;
}

document
  .getElementById("generateBtn")
  .addEventListener("click", generateGrid);

generateGrid();

function animate() {

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {

  camera.aspect =
    container.clientWidth /
    container.clientHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    container.clientWidth,
    container.clientHeight
  );
});

</script>

</body>
</html>
